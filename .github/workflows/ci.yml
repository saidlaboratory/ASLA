name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test,figures,dev]"
      - name: Verify console script
        run: asla --help
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy asla
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
