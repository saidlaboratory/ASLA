name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test,figures,dev]"
      - name: Record toolchain versions
        # The type checker and numpy both float (mypy>=1.8, numpy>=1.23), and
        # numpy's shape-generic stubs differ enough between releases to fail a
        # build that passes locally. Printing the resolved versions makes such a
        # failure diagnosable from the log instead of needing a bisect.
        run: |
          python --version
          python -c "import numpy, scipy, pandas; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('pandas', pandas.__version__)"
          mypy --version
          ruff --version
      - name: Verify console script
        run: asla --help
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy asla
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
