[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asla"
version = "0.1.0"
description = "Algorithm-selection audit for scaling-law leaderboard decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyarrow",
]

[project.optional-dependencies]
figures = ["matplotlib"]
wandb = ["wandb"]
test = ["pytest"]
all = ["matplotlib", "wandb", "pytest"]

[project.scripts]
asla = "asla.cli:main"

[tool.setuptools.packages.find]
include = ["asla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
